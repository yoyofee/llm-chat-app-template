<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">
<title>yoyofeeai - 家庭 AI</title>

<style>
:root {
  --accent: #10a37f;
  --bg: #212121;
  --panel: #171717;
  --panel2: #2f2f2f;
  --text: #ececec;
  --muted: #a0a0a0;
  --border: #383838;
}

/* 浅色模式 */
:root[data-theme="light"] {
  --bg: #f7f7f8;
  --panel: #ffffff;
  --panel2: #eeeeef;
  --text: #202123;
  --muted: #6b7280;
  --border: #dedee3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Microsoft YaHei", sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.hidden { display: none !important; }

/* 登录页面 */

#login-view {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 410px;
  padding: 34px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 15px 50px #0005;
}

.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand-logo {
  width: 54px;
  height: 54px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: var(--accent);
  color: white;
  font-size: 25px;
  font-weight: bold;
}

.brand h1 { margin: 0; font-size: 27px; }
.brand p { color: var(--muted); font-size: 14px; }

.field { margin: 18px 0; }

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: var(--muted);
}

.field input, .field select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  outline: none;
  background: var(--bg);
  color: var(--text);
}

.field input:focus { border-color: var(--accent); }

.primary-button {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: var(--accent);
  color: white;
  font-weight: bold;
}

.error {
  color: #ff8585;
  font-size: 13px;
  min-height: 20px;
  margin-top: 12px;
}

.login-footer {
  margin-top: 25px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.text-button {
  display: block;
  margin: 18px auto 0;
  padding: 5px;
  background: transparent;
  color: var(--muted);
  border: 0;
  font-size: 13px;
}

/* 聊天主界面 */

#chat-view {
  height: 100vh;
  min-height: 500px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  height: 62px;
  flex-shrink: 0;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  z-index: 5;
}

.topbar strong { font-size: 19px; }

.top-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}

.top-actions select {
  max-width: 125px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
}

.small-button {
  padding: 8px 12px;
  font-size: 13px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.app-layout {
  flex: 1;
  min-height: 0;
  display: flex;
}

/* 左侧历史记录栏 */

.sidebar {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 12px;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

.new-chat-button {
  width: 100%;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  color: var(--text);
  border: 1px solid #555;
  border-radius: 9px;
  text-align: left;
}

.new-chat-button:hover,
.history-item:hover {
background: var(--panel2);
}

.sidebar-title {
  padding: 22px 9px 10px;
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
}

.history-list {
  flex: 1;
  overflow-y: auto;
}

.history-item {
  width: 100%;
  display: block;
  margin: 3px 0;
  padding: 10px;
  overflow: hidden;
  text-align: left;
  white-space: nowrap;
  text-overflow: ellipsis;
  background: transparent;
  color: var(--text);
  border: 0;
  border-radius: 8px;
  font-size: 13px;
}

.history-item.active {
background: var(--panel2);
}

.sidebar-footer {
  padding: 12px 8px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

/* 聊天区域 */
.chat-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chat-container {
  width: 100%;
  max-width: 900px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 20px 24px 10px;
}

.chat-messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 5px;
}

.message {
  max-width: 85%;
  width: fit-content;
  margin: 15px 0;
  padding: 13px 17px;
  border-radius: 16px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.message p {
  margin: 0;
  white-space: pre-wrap;
}

.user-message {
  margin-left: auto;
  background: var(--panel2);
}

.assistant-message {
  margin-right: auto;
  background: transparent;
}

.welcome {
  margin: auto;
  padding: 35px 10px;
  text-align: center;
  color: var(--muted);
}

.welcome h2 {
  color: var(--text);
  font-size: 27px;
  font-weight: 600;
}

.message-input {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 15px;
  box-shadow: 0 4px 20px #0002;
}

#user-input {
  flex: 1;
  min-height: 44px;
  max-height: 180px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 10px;
}

#send-button {
  align-self: flex-end;
  padding: 11px 19px;
  border: 0;
  border-radius: 9px;
  background: var(--accent);
  color: white;
}

.typing-indicator {
  display: none;
  color: var(--muted);
  padding: 10px;
}

.typing-indicator.visible {
  display: block;
}

.notice {
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  padding: 12px;
}

/* 电脑端人民币动画栏 */
.money-panel {
  width: 260px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  border-left: 1px solid var(--border);
  background: var(--panel);
  padding: 20px 12px;
  text-align: center;
}

.money-title {
  font-size: 17px;
  font-weight: bold;
  margin: 10px 0 22px;
}

.money-amount {
  color: var(--accent);
  font-size: 30px;
  font-weight: bold;
  animation: money-bounce 2.5s ease-in-out infinite;
}

@keyframes money-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.money-stage {
  position: absolute;
  inset: 120px 0 0;
  overflow: hidden;
  pointer-events: none;
}

.money-item {
  position: absolute;
  top: -70px;
  animation: money-fall linear forwards;
  user-select: none;
  will-change: transform;
}

.money-bill {
  font-size: 30px;
  padding: 5px 10px;
  color: #168653;
  background: #d9f5df;
  border: 1px solid #168653;
  border-radius: 5px;
}

.money-coin {
  font-size: 30px;
  animation: coin-spin 1.4s linear infinite;
}

@keyframes money-fall {
  from { transform: translateY(-80px) rotate(0deg); }
  to { transform: translateY(700px) rotate(360deg); }
}

@keyframes coin-spin {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

.money-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 25px;
  position: relative;
  z-index: 2;
}

.money-controls select,
.money-controls button {
  width: 100%;
  padding: 9px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
}

/* 手机历史记录菜单 */
.mobile-menu-button {
  display: none;
}

.sidebar-overlay {
  display: none;
}

/* 小屏幕：历史记录改为左侧抽屉 */
@media (max-width: 700px) {
  #chat-view {
    height: 100dvh;
    min-height: 0;
  }

  .topbar {
    height: 56px;
    padding: 0 10px;
  }

  .mobile-menu-button {
    display: inline-block;
    margin-right: 8px;
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .topbar strong {
    font-size: 17px;
  }

  .top-actions {
    gap: 4px;
  }

  .top-actions select {
    max-width: 85px;
    padding: 6px 3px;
    font-size: 12px;
  }

  #account-label {
    display: none;
  }

  .money-panel {
    display: none;
  }

  .sidebar {
    position: fixed;
    z-index: 30;
    top: 56px;
    bottom: 0;
    left: 0;
    width: min(280px, 82vw);
    padding: 14px 12px;
    transform: translateX(-105%);
    transition: transform .25s ease;
    box-shadow: 8px 0 25px #0003;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-overlay.visible {
    display: block;
    position: fixed;
    inset: 56px 0 0;
    z-index: 20;
    background: #0008;
  }

  .app-layout {
    min-height: 0;
  }

  .chat-main {
    width: 100%;
  }

  .chat-container {
    padding: 10px 9px;
  }

  .message {
    max-width: 95%;
  }

  .message-input {
    padding: 8px;
    margin-bottom: env(safe-area-inset-bottom);
  }

  #user-input {
    font-size: 16px;
  }

  .small-button {
    padding: 7px 8px;
  }
}

@media (max-width: 380px) {
  .topbar strong {
    font-size: 15px;
  }

  .top-actions select {
    max-width: 72px;
  }
}

/* 尊重系统减少动态效果设置 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<!-- 登录页面 -->
<section id="login-view">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">Y</div>
      <h1>yoyofeeai</h1>
      <p>你的家庭 AI 助手</p>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="login-username">家庭成员账号</label>
        <input id="login-username" type="text"
          placeholder="请输入账号" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="login-password">登录密码</label>
        <input id="login-password" type="password"
          placeholder="请输入密码" autocomplete="current-password" required>
      </div>

      <button class="primary-button" type="submit" id="login-button">
        登录 yoyofeeai
      </button>
      <div class="error" id="login-error"></div>
    </form>

    <button class="text-button" type="button" id="show-bootstrap">
      首次使用？初始化管理员
    </button>

    <form id="bootstrap-form" class="hidden">
      <div class="field">
        <label for="setup-secret">管理员初始化密钥</label>
        <input id="setup-secret" type="password" required>
      </div>

      <div class="field">
        <label for="admin-username">管理员账号</label>
        <input id="admin-username" type="text"
          autocomplete="username" required>
      </div>

      <div class="field">
        <label for="admin-password">管理员密码（至少12位）</label>
        <input id="admin-password" type="password"
          autocomplete="new-password" required minlength="12">
      </div>

      <button class="primary-button" type="submit">创建管理员</button>
      <div class="error" id="bootstrap-error"></div>
      <button class="text-button" type="button" id="back-to-login">
        返回登录
      </button>
    </form>

    <div class="login-footer">仅供家庭成员使用 · yoyofeeai</div>
  </div>
</section>

<!-- 修改密码页面 -->
<section id="password-view" class="hidden">
  <div class="login-card" style="margin:auto">
    <div class="brand">
      <div class="brand-logo">Y</div>
      <h1>修改初始密码</h1>
      <p>为了账号安全，请先设置新密码</p>
    </div>

    <form id="password-form">
      <div class="field">
        <label for="new-password">新密码（至少10位）</label>
        <input id="new-password" type="password"
          autocomplete="new-password" required minlength="10">
      </div>
      <button class="primary-button" type="submit">保存新密码</button>
      <div class="error" id="password-error"></div>
    </form>
  </div>
</section>

<!-- 聊天主页面 -->
<section id="chat-view" class="hidden">

<header class="topbar">
  <div class="topbar-brand">
    <button class="small-button mobile-menu-button"
      id="mobile-menu-button" type="button"
      aria-label="打开聊天记录">☰</button>
    <strong>yoyofeeai</strong>
  </div>
    <strong>yoyofeeai</strong>

    <div class="top-actions">
      <span id="account-label"></span>

      <select id="model-select" aria-label="选择AI模型">
        <option value="cloudflare">Cloudflare AI</option>
        <option value="openai">ChatGPT</option>
        <option value="deepseek">DeepSeek</option>
        <option value="doubao">豆包</option>
      </select>

<select id="mode-select" aria-label="界面模式">
  <option value="dark">深色模式</option>
  <option value="light">浅色模式</option>
</select>

<select id="theme-select" aria-label="强调颜色">
  <option value="#10a37f">绿色</option>
  <option value="#3b82f6">蓝色</option>
  <option value="#8b5cf6">紫色</option>
  <option value="#f59e0b">橙色</option>
  <option value="#ec4899">粉色</option>
</select>

      <button class="small-button" id="logout-button">退出</button>
    </div>
  </header>

  <div class="app-layout">

    <!-- 左侧聊天记录 -->
    <aside class="sidebar">
      <button class="new-chat-button" id="new-chat-button" type="button">
        <span>＋</span>
        <span>新建聊天</span>
      </button>

      <div class="sidebar-title">最近聊天</div>

      <div class="history-list" id="history-list">
        <div class="sidebar-footer">聊天记录加载中……</div>
      </div>

      <div class="sidebar-footer">yoyofeeai 家庭 AI</div>
    </aside>

    <!-- 右侧聊天窗口 -->
    <main class="chat-main">
      <div class="chat-container">

        <div class="welcome" id="welcome">
          <h2>有什么可以帮忙的？</h2>
          <p>欢迎使用 yoyofeeai 家庭 AI 助手</p>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="typing-indicator" id="typing-indicator">
          AI 正在思考……
        </div>

        <div class="message-input">
          <textarea id="user-input" rows="1"
            placeholder="给 yoyofeeai 发送消息……"></textarea>
          <button id="send-button" type="button">发送</button>
        </div>

        <div class="notice">
          AI 生成的内容可能存在错误，请注意核实。
        </div>

      </div>
    </main>

  </div>
      <!-- 手机历史记录遮罩 -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- 电脑端人民币动画 -->
    <aside class="money-panel" id="money-panel">
      <div class="money-title">财富好运站</div>
      <div class="money-amount">¥888.88</div>

      <div class="money-stage" id="money-stage"></div>

      <div class="money-controls">
        <button id="money-toggle" type="button">暂停动画</button>

        <select id="money-density" aria-label="动画密度">
          <option value="low">少量</option>
          <option value="normal" selected>正常</option>
          <option value="high">热闹</option>
        </select>
      </div>
    </aside>
</section>
<script src="chat.js"></script>
</body>
</html>
